[package]
name = "bakeryos-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.19"
flag-rs = "0.10.0"
reqwest = { version = "0.13", features = ["json"] }
sysinfo = "0.39.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
walkdir = "2.5.0"
